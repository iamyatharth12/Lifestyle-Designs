    <path d="M-30,40 L30,40 L20,50 L-20,50 Z" fill="#888"/>
    <path d="M-90,60 L-50,40 L-20,50 Q0,45 20,50 L50,40 L90,60 L130,140 L100,160 L100,640 L-100,640 L-100,160 L-130,140 Z" fill="#C8A45A"/>
    <text x="0" y="350" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="36" fill="#0B0B0F" font-weight="700">Limited</text>
