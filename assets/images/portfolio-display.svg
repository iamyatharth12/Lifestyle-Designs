    <path d="M-30,40 L30,40 L20,50 L-20,50 Z" fill="#888"/>
    <path d="M-90,60 L-50,40 L-20,50 Q0,45 20,50 L50,40 L90,60 L130,140 L100,160 L100,640 L-100,640 L-100,160 L-130,140 Z" fill="#0F2A1F"/>
    <text x="0" y="340" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="38" fill="#C8A45A">RUN</text>
    <text x="0" y="385" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="38" fill="#C8A45A">10K</text>
  </g>
  <g transform="translate(1400,180)">
