<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Custom apron and chef uniforms">
  <defs>
    <linearGradient id="bgA" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F4ECD8"/><stop offset="100%" stop-color="#D9C499"/></linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgA)"/>
  <!-- Apron -->
  <g transform="translate(280,100)">
    <!-- Neck strap -->
    <path d="M70,0 Q120,30 170,0" fill="none" stroke="#A8884A" stroke-width="6"/>
    <!-- Body -->
    <path d="M30,40 L210,40 L240,640 L0,640 Z" fill="#FFFFFF"/>
    <path d="M30,40 L0,640 L20,640 L50,40 Z" fill="#EFEFEF"/>
    <path d="M210,40 L240,640 L220,640 L190,40 Z" fill="#EFEFEF"/>
    <!-- Pocket -->
    <line x1="80" y1="380" x2="160" y2="380" stroke="#D8D8DC" stroke-width="2"/>
    <line x1="80" y1="380" x2="80" y2="440" stroke="#D8D8DC" stroke-width="2"/>
    <line x1="160" y1="380" x2="160" y2="440" stroke="#D8D8DC" stroke-width="2"/>
    <line x1="80" y1="440" x2="160" y2="440" stroke="#D8D8DC" stroke-width="2"/>
    <!-- Logo -->
    <g transform="translate(120,200)">
      <text x="0" y="-20" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="22" fill="#7A1F2B">Saffron</text>
      <text x="0" y="2" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" letter-spacing="4" fill="#0B0B0F">KITCHEN</text>
      <line x1="-25" y1="14" x2="25" y2="14" stroke="#C8A45A" stroke-width="1"/>
      <text x="0" y="34" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="2" fill="#6B6B78">EST · 2019</text>
    </g>
  </g>
</svg>
