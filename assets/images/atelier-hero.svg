<!-- Atelier / workshop hero mood image -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio workshop with apparel and screen printing equipment">
  <defs>
    <linearGradient id="atelierBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A22"/>
      <stop offset="100%" stop-color="#08080D"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFE7B5" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFE7B5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7A5A3A"/>
      <stop offset="100%" stop-color="#3A2614"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#atelierBg)"/>
  <!-- Hanging lamp glow -->
  <circle cx="800" cy="280" r="400" fill="url(#lampGlow)"/>
  <!-- Pendant cord -->
  <line x1="800" y1="0" x2="800" y2="220" stroke="#2A2A33" stroke-width="2"/>
  <!-- Lamp shade -->
  <path d="M740,220 L860,220 L880,300 L720,300 Z" fill="#0E0E13" stroke="#C8A45A" stroke-width="1.5"/>
  <!-- Workbench -->
  <rect x="0" y="700" width="1600" height="300" fill="url(#wood)"/>
  <line x1="0" y1="700" x2="1600" y2="700" stroke="#C8A45A" stroke-width="1" opacity="0.4"/>
  <!-- Screen printing frame (background) -->
  <g transform="translate(280,400)">
    <rect width="380" height="320" fill="#3A3A45" stroke="#C8A45A" stroke-width="3"/>
    <rect x="20" y="20" width="340" height="280" fill="#FFFFFF" opacity="0.08"/>
    <rect x="20" y="20" width="340" height="280" fill="none" stroke="#fff" stroke-width="0.5" stroke-dasharray="3 5"/>
    <text x="190" y="170" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-style="italic" fill="#fff" opacity="0.3">silk screen</text>
  </g>
  <!-- Folded tees stack -->
  <g transform="translate(950,500)">
    <rect width="280" height="40" fill="#7A1F2B"/>
    <rect y="44" width="280" height="40" fill="#0E2A47"/>
    <rect y="88" width="280" height="40" fill="#1A1A20"/>
    <rect y="132" width="280" height="40" fill="#FFFFFF"/>
    <rect y="176" width="280" height="40" fill="#C8A45A"/>
  </g>
  <!-- Hanging tees -->
  <g transform="translate(1200,260)">
    <path d="M0,40 L20,20 L40,30 Q50,25 60,30 L80,20 L100,40 L100,200 L0,200 Z" fill="#7A1F2B"/>
    <path d="M0,40 L0,200 L100,200 L100,40" fill="none" stroke="#000" stroke-width="0.5" opacity="0.3"/>
  </g>
  <g transform="translate(1340,280)">
    <path d="M0,40 L20,20 L40,30 Q50,25 60,30 L80,20 L100,40 L100,180 L0,180 Z" fill="#0E2A47"/>
  </g>
  <!-- Hanger -->
  <line x1="1250" y1="220" x2="1250" y2="260" stroke="#888" stroke-width="1.5"/>
  <line x1="1390" y1="240" x2="1390" y2="280" stroke="#888" stroke-width="1.5"/>
  <!-- Spools of thread -->
  <g transform="translate(700,760)">
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="#C8A45A"/>
    <rect x="-30" y="-30" width="60" height="30" fill="#C8A45A"/>
    <ellipse cx="0" cy="-30" rx="30" ry="10" fill="#E8D5A8"/>
  </g>
  <g transform="translate(820,760)">
    <ellipse cx="0" cy="0" rx="38" ry="12" fill="#0E2A47"/>
    <rect x="-30" y="-30" width="60" height="30" fill="#0E2A47"/>
    <ellipse cx="0" cy="-30" rx="30" ry="10" fill="#1B3A5C"/>
  </g>
  <!-- Subtle particles -->
  <g fill="#C8A45A" opacity="0.5">
    <circle cx="200" cy="300" r="2"/>
    <circle cx="600" cy="180" r="1.5"/>
    <circle cx="900" cy="350" r="2"/>
    <circle cx="1100" cy="220" r="1.5"/>
    <circle cx="1450" cy="380" r="2"/>
    <circle cx="400" cy="500" r="1.5"/>
    <circle cx="500" cy="620" r="2"/>
  </g>
</svg>
