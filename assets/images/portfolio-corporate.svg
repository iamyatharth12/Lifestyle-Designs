    <path d="M70,10 Q100,40 130,10 L120,30 Q100,55 80,30 Z" fill="#EFEFEF"/>
    <circle cx="100" cy="200" r="3" fill="#0B0B0F"/>
    <circle cx="100" cy="240" r="3" fill="#0B0B0F"/>
    <text x="60" y="380" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#0B0B0F">Veritas</text>
    <text x="60" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="2" fill="#0B0B0F">LAW GROUP</text>
  </g>
  <g transform="translate(540,260)">
    <path d="M0,40 L40,0 L70,10 Q100,5 130,10 L160,0 L200,40 L240,100 L210,120 L210,640 L-10,640 L-10,120 L-40,100 Z" fill="#0F2A1F"/>
    <path d="M70,10 Q100,40 130,10 L120,30 Q100,55 80,30 Z" fill="#06150E"/>
    <text x="60" y="380" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#C8A45A">Meridian</text>
    <text x="60" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="2" fill="#C8A45A">CLINIC</text>
