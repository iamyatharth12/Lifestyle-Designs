<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Corporate polo shirts in brand colors">
  <defs>
    <linearGradient id="bgCp" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F8F4ED"/><stop offset="100%" stop-color="#EAE0CB"/></linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgCp)"/>
  <!-- Three polos side by side -->
  <g transform="translate(40,260)">
    <path d="M0,40 L40,0 L70,10 Q100,5 130,10 L160,0 L200,40 L240,100 L210,120 L210,640 L-10,640 L-10,120 L-40,100 Z" fill="#0E2A47"/>
    <path d="M70,10 Q100,40 130,10 L120,30 Q100,55 80,30 Z" fill="#08203A"/>
    <circle cx="100" cy="200" r="3" fill="#C8A45A"/>
    <circle cx="100" cy="240" r="3" fill="#C8A45A"/>
    <line x1="100" y1="40" x2="100" y2="280" stroke="#1B3A5C" stroke-width="2"/>
    <text x="60" y="380" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="13" fill="#C8A45A">Apex</text>
    <text x="60" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="2" fill="#C8A45A">CONSULTING</text>
  </g>
  <g transform="translate(290,260)">
