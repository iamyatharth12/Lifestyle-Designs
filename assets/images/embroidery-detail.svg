<!-- Embroidery close-up -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Close up of embroidery thread detail">
  <defs>
    <linearGradient id="bgEmb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2EAD6"/>
      <stop offset="100%" stop-color="#D9C99E"/>
    </linearGradient>
    <radialGradient id="threadShade" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#0E2A47"/>
      <stop offset="100%" stop-color="#08203A"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgEmb)"/>
  <!-- Macro fabric weave -->
  <g opacity="0.18" stroke="#7A6B43" stroke-width="0.5">
    <line x1="0" y1="40" x2="800" y2="40"/><line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="120" x2="800" y2="120"/><line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="200" x2="800" y2="200"/><line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="280" x2="800" y2="280"/><line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="360" x2="800" y2="360"/><line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="440" x2="800" y2="440"/><line x1="0" y1="480" x2="800" y2="480"/>
    <line x1="0" y1="520" x2="800" y2="520"/><line x1="0" y1="560" x2="800" y2="560"/>
    <line x1="0" y1="600" x2="800" y2="600"/><line x1="0" y1="640" x2="800" y2="640"/>
    <line x1="0" y1="680" x2="800" y2="680"/><line x1="0" y1="720" x2="800" y2="720"/>
    <line x1="0" y1="760" x2="800" y2="760"/><line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="0" y1="840" x2="800" y2="840"/><line x1="0" y1="880" x2="800" y2="880"/>
    <line x1="0" y1="920" x2="800" y2="920"/><line x1="0" y1="960" x2="800" y2="960"/>
  </g>
  <!-- Embroidered monogram circle -->
  <g transform="translate(400,500)">
    <circle r="180" fill="none" stroke="url(#threadShade)" stroke-width="20" stroke-dasharray="6 4"/>
    <circle r="150" fill="none" stroke="#C8A45A" stroke-width="6"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="180" fill="#0E2A47">L</text>
    <!-- Thread stitches radiating -->
    <g stroke="#0E2A47" stroke-width="2" opacity="0.7">
      <line x1="-180" y1="0" x2="-200" y2="-10"/>
      <line x1="180" y1="0" x2="200" y2="-10"/>
      <line x1="-160" y1="80" x2="-178" y2="92"/>
      <line x1="160" y1="80" x2="178" y2="92"/>
      <line x1="-160" y1="-80" x2="-178" y2="-92"/>
      <line x1="160" y1="-80" x2="178" y2="-92"/>
    </g>
  </g>
</svg>
