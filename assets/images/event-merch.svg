<!-- Event merch — black tee with bold typography -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Black event merchandise t-shirt">
  <defs>
    <linearGradient id="bgEvent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F0"/>
      <stop offset="100%" stop-color="#E8E1D0"/>
    </linearGradient>
    <linearGradient id="teeBlack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1A20"/>
      <stop offset="100%" stop-color="#08080B"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bgEvent)"/>
  <ellipse cx="400" cy="800" rx="270" ry="34" fill="#000" opacity="0.15"/>
  <!-- Tee -->
  <path d="M180,300 L260,240 L300,230 Q400,210 500,230 L540,240 L620,300 L690,380 L640,420 L640,830 L160,830 L160,420 L110,380 Z" fill="url(#teeBlack)"/>
  <!-- Neck -->
  <path d="M300,230 Q400,275 500,230 L480,250 Q400,290 320,250 Z" fill="#000"/>
  <!-- Sleeves -->
  <path d="M180,300 L110,380 L160,420 Z" fill="#0E0E12"/>
  <path d="M620,300 L690,380 L640,420 Z" fill="#0E0E12"/>
  <!-- Print -->
  <g transform="translate(400,480)">
    <text x="0" y="-20" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="64" fill="#FFFFFF" letter-spacing="-2">RUN</text>
    <text x="0" y="40" text-anchor="middle" font-family="Inter,sans-serif" font-weight="900" font-size="64" fill="#C8A45A" letter-spacing="-2">FORWARD</text>
    <line x1="-100" y1="60" x2="100" y2="60" stroke="#fff" stroke-width="1"/>
    <text x="0" y="84" text-anchor="middle" font-family="Inter,sans-serif" font-weight="500" font-size="11" letter-spacing="6" fill="#fff">2026 · MARATHON</text>
  </g>
</svg>
