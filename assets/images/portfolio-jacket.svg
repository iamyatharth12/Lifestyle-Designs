<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Custom embroidered jacket detail">
  <defs>
    <linearGradient id="bgJ" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F1E9D2"/><stop offset="100%" stop-color="#D4C29A"/></linearGradient>
    <linearGradient id="jacket" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0F2A1F"/><stop offset="100%" stop-color="#06150E"/></linearGradient>
  </defs>
  <rect width="800" height="1100" fill="url(#bgJ)"/>
  <ellipse cx="400" cy="950" rx="260" ry="32" fill="#000" opacity="0.18"/>
  <path d="M150,250 L280,210 L350,260 L400,300 L450,260 L520,210 L650,250 L670,950 L130,950 Z" fill="url(#jacket)"/>
  <path d="M350,260 L400,310 L450,260 L430,420 L370,420 Z" fill="#04100A"/>
  <path d="M280,210 L260,250 L320,420 L350,260 Z" fill="#0A1F14"/>
  <path d="M520,210 L540,250 L480,420 L450,260 Z" fill="#0A1F14"/>
  <line x1="400" y1="310" x2="400" y2="940" stroke="#04100A" stroke-width="4"/>
  <circle cx="400" cy="420" r="5" fill="#C8A45A"/>
  <circle cx="400" cy="500" r="5" fill="#C8A45A"/>
  <circle cx="400" cy="580" r="5" fill="#C8A45A"/>
  <!-- Embroidery on left chest -->
  <g transform="translate(245,380)">
    <path d="M-50,0 Q-50,-40 0,-50 Q50,-40 50,0 Q50,30 0,50 Q-50,30 -50,0 Z" fill="none" stroke="#C8A45A" stroke-width="2"/>
    <text x="0" y="-15" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#C8A45A">Highland</text>
    <text x="0" y="2" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#C8A45A">Society</text>
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#C8A45A" stroke-width="1"/>
    <text x="0" y="22" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" letter-spacing="2" fill="#C8A45A">EST · 1962</text>
  </g>
  <!-- Texture -->
  <g opacity="0.08" stroke="#fff" stroke-width="0.5" fill="none">
    <path d="M150,600 Q400,620 650,600"/>
    <path d="M150,700 Q400,720 650,700"/>
    <path d="M150,800 Q400,820 650,800"/>
  </g>
</svg>
