<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Stack of folded apparel with brand labels">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#EFEFEF"/></linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bgS)"/>
  <g transform="translate(120,140)">
    <rect width="560" height="50" fill="#0E2A47"/>
    <rect y="56" width="560" height="50" fill="#7A1F2B"/>
    <rect y="112" width="560" height="50" fill="#1A1A20"/>
    <rect y="168" width="560" height="50" fill="#F4ECD8"/>
    <rect y="224" width="560" height="50" fill="#C8A45A"/>
    <rect y="280" width="560" height="50" fill="#FFFFFF" stroke="#D8D8DC"/>
    <rect y="336" width="560" height="50" fill="#0F2A1F"/>
    <rect y="392" width="560" height="50" fill="#3A3A45"/>
    <rect y="448" width="560" height="50" fill="#FFFFFF" stroke="#D8D8DC"/>
    <!-- Stitching -->
    <line x1="0" y1="0" x2="560" y2="0" stroke="#fff" stroke-width="0.5" opacity="0.3"/>
    <line x1="0" y1="498" x2="560" y2="498" stroke="#000" stroke-width="0.5" opacity="0.2"/>
  </g>
  <!-- Tags hanging -->
  <g transform="translate(80,80)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#C8A45A" stroke-width="1"/>
    <rect width="120" height="70" fill="#F4ECD8" stroke="#C8A45A" stroke-width="1"/>
    <text x="60" y="25" text-anchor="middle" font-family="Georgia,serif" font-style="italic" font-size="14" fill="#0B0B0F">Lifestyle</text>
    <text x="60" y="42" text-anchor="middle" font-family="Inter,sans-serif" font-size="7" letter-spacing="3" fill="#6B6B78">DESIGNS</text>
    <text x="60" y="58" text-anchor="middle" font-family="Inter,sans-serif" font-size="6" letter-spacing="2" fill="#0B0B0F">MADE WITH CARE</text>
  </g>
</svg>
