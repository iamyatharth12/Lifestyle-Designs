<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Studio workshop wide hero image">
  <defs>
    <linearGradient id="bgW" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1B1B24"/><stop offset="100%" stop-color="#0B0B0F"/></linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5"><stop offset="0%" stop-color="#FFE7B5" stop-opacity="0.45"/><stop offset="100%" stop-color="#FFE7B5" stop-opacity="0"/></radialGradient>
    <linearGradient id="wood2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#6E4F2E"/><stop offset="100%" stop-color="#2E1B0A"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bgW)"/>
  <circle cx="800" cy="200" r="500" fill="url(#lamp)"/>
  <!-- Pendant -->
  <line x1="800" y1="0" x2="800" y2="180" stroke="#2A2A33" stroke-width="2"/>
  <path d="M740,180 L860,180 L880,250 L720,250 Z" fill="#0E0E13" stroke="#C8A45A" stroke-width="1.5"/>
  <!-- Workbench -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#wood2)"/>
  <line x1="0" y1="620" x2="1600" y2="620" stroke="#C8A45A" stroke-width="1" opacity="0.4"/>
  <!-- Screen print frame -->
  <g transform="translate(160,300)">
    <rect width="360" height="300" fill="#3A3A45" stroke="#C8A45A" stroke-width="3"/>
    <rect x="20" y="20" width="320" height="260" fill="#FFFFFF" opacity="0.1"/>
    <text x="180" y="160" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-style="italic" fill="#fff" opacity="0.4">silk screen</text>
  </g>
  <!-- Folded apparel -->
  <g transform="translate(620,520)">
    <rect width="260" height="34" fill="#7A1F2B"/>
    <rect y="38" width="260" height="34" fill="#0E2A47"/>
    <rect y="76" width="260" height="34" fill="#1A1A20"/>
    <rect y="114" width="260" height="34" fill="#FFFFFF"/>
    <rect y="152" width="260" height="34" fill="#C8A45A"/>
  </g>
  <!-- Hanging tees -->
  <g transform="translate(1000,180)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#888"/>
    <path d="M-30,60 L30,60 L20,72 L-20,72 Z" fill="#888"/>
    <path d="M-80,80 L-40,62 L-20,72 Q0,68 20,72 L40,62 L80,80 L120,150 L90,170 L90,640 L-90,640 L-90,170 L-120,150 Z" fill="#7A1F2B"/>
  </g>
  <g transform="translate(1180,200)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#888"/>
    <path d="M-30,60 L30,60 L20,72 L-20,72 Z" fill="#888"/>
    <path d="M-80,80 L-40,62 L-20,72 Q0,68 20,72 L40,62 L80,80 L120,150 L90,170 L90,620 L-90,620 L-90,170 L-120,150 Z" fill="#0E2A47"/>
  </g>
  <g transform="translate(1360,220)">
    <line x1="0" y1="0" x2="0" y2="60" stroke="#888"/>
    <path d="M-30,60 L30,60 L20,72 L-20,72 Z" fill="#888"/>
    <path d="M-80,80 L-40,62 L-20,72 Q0,68 20,72 L40,62 L80,80 L120,150 L90,170 L90,600 L-90,600 L-90,170 L-120,150 Z" fill="#FFFFFF"/>
  </g>
  <!-- Spools -->
  <g transform="translate(540,580)">
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#C8A45A"/>
    <rect x="-26" y="-26" width="52" height="26" fill="#C8A45A"/>
    <ellipse cx="0" cy="-26" rx="26" ry="8" fill="#E8D5A8"/>
  </g>
  <g transform="translate(940,580)">
    <ellipse cx="0" cy="0" rx="34" ry="10" fill="#0E2A47"/>
    <rect x="-26" y="-26" width="52" height="26" fill="#0E2A47"/>
    <ellipse cx="0" cy="-26" rx="26" ry="8" fill="#1B3A5C"/>
  </g>
  <g fill="#C8A45A" opacity="0.45">
    <circle cx="180" cy="280" r="2"/><circle cx="540" cy="160" r="1.5"/><circle cx="860" cy="320" r="2"/>
    <circle cx="1080" cy="180" r="1.5"/><circle cx="1480" cy="340" r="2"/><circle cx="380" cy="460" r="1.5"/>
    <circle cx="700" cy="560" r="2"/><circle cx="1320" cy="500" r="1.5"/>
  </g>
</svg>
